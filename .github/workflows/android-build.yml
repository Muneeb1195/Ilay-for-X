name: Android Release CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-build:
    name: Test & Build Release Artifacts
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Resolve release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release-upload-key.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=production" >> "$GITHUB_ENV"
            {
              echo "### Signing Status"
              echo "Signed with configured **production release keystore** from GitHub Secrets."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            TEMP_PASS="ilay-ci-temp-$(head -c 12 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
            echo "::add-mask::$TEMP_PASS"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -storepass "$TEMP_PASS" \
              -alias upload \
              -keypass "$TEMP_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Ilay for X CI,O=Ilay for X,C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=temporary" >> "$GITHUB_ENV"
            {
              echo "### Signing Status"
              echo "> **Warning:** Release signing secrets (\`RELEASE_KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, \`KEY_PASSWORD\`) are not configured yet. Artifacts in this run were signed with a **temporary ephemeral keystore** (updates between runs will require reinstalling until permanent secrets are configured)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build multi-ABI & universal Release APKs (R8)
        run: gradle :app:assembleRelease -PenableAbiSplits=true --stacktrace

      - name: Build Release App Bundle (.aab) (R8)
        run: gradle :app:bundleRelease --stacktrace

      - name: Package release artifacts and SHA-256 checksums
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="release"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/ilay-for-x-${VER}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/ilay-for-x-${VER}-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "dist/ilay-for-x-${VER}-x86_64.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/ilay-for-x-${VER}-universal.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/ilay-for-x-${VER}.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          ls -lh dist/

      - name: Clean up temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-upload-key.jks"

      - name: Upload Release APKs & AAB artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ilay-for-x-release-artifacts
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
